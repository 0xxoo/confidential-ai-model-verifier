name: CC Merkle model reference
run-name: cc-merkle-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Public Hugging Face organization/repository
        required: true
        type: string
      revision:
        description: Exact 40-character HF commit
        required: true
        type: string
      nonce:
        description: Fresh 32-byte nonce in lowercase hex
        required: true
        type: string
      request_id:
        description: Unique 16-byte request ID in lowercase hex
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cc-merkle-${{ github.repository }}-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Stream pinned raw weight files in parallel
        env:
          MODEL_ID: ${{ inputs.model_id }}
          REVISION: ${{ inputs.revision }}
          NONCE: ${{ inputs.nonce }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir out
          python3 merkle_reference.py reference --model-id "$MODEL_ID" --revision "$REVISION" --nonce "$NONCE" --request-id "$REQUEST_ID" --workers 4 --output out/weights.json
          python3 merkle_reference.py envelope --result out/weights.json --output out/result.json
      - name: Attest exact result and workflow provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/result.json
      - name: Save provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" out/bundle.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cc-merkle-${{ inputs.request_id }}
          path: |
            out/result.json
            out/bundle.json
          if-no-files-found: error
          retention-days: 7
